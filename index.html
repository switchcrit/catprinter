<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<title>Cat Printer</title>
<style>
  :root {
    --bg: #f4f1ea; --card: #fffdf8; --ink: #1d1b18; --muted: #6f6a61; --line: #e3ddd0;
    --accent: #1f6f5c; --accent-ink: #ffffff; --warn: #b4542b; --ok: #2f8a4c; --paper: #ffffff;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161513; --card: #211f1c; --ink: #f1ede4; --muted: #a39d92; --line: #35322d;
      --accent: #4fb596; --accent-ink: #0d1f1a; --warn: #e08a5e; --ok: #5fc27c; --paper: #f7f5f0;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161513; --card: #211f1c; --ink: #f1ede4; --muted: #a39d92; --line: #35322d;
    --accent: #4fb596; --accent-ink: #0d1f1a; --warn: #e08a5e; --ok: #5fc27c; --paper: #f7f5f0;
    --shadow: none;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent; }
  main { max-width: 520px; margin: 0 auto; padding: 16px 16px calc(120px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; gap: 12px; margin: 4px 0 16px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; flex: 1; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); } .dot.busy { background: var(--warn); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px;
    margin-bottom: 12px; box-shadow: var(--shadow); }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    margin: 0 0 10px; font-weight: 600; }
  .seg { display: flex; background: var(--bg); border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--ink); padding: 8px;
    border-radius: 8px; font: inherit; font-size: 15px; }
  .seg button.on { background: var(--card); box-shadow: 0 1px 2px rgba(0,0,0,.12); font-weight: 600; }
  textarea { width: 100%; min-height: 96px; border: 1px solid var(--line); border-radius: 10px; padding: 10px;
    font: inherit; background: var(--bg); color: var(--ink); resize: vertical; margin-top: 10px; }
  .row { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  .row label { flex: 0 0 auto; min-width: 110px; font-size: 15px; }
  .row input[type=range] { flex: 1; accent-color: var(--accent); }
  .row .val { width: 32px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
  .toggle { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; font-size: 15px; }
  .toggle input { width: 20px; height: 20px; accent-color: var(--accent); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); border-radius: 10px; padding: 10px 14px; font: inherit; font-size: 15px; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
  .btn:disabled { opacity: .45; }
  .file { margin-top: 10px; display: flex; gap: 10px; align-items: center; }
  .file .name { color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .preview { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .preview canvas { width: 100%; max-width: 384px; background: var(--paper); image-rendering: pixelated;
    border-radius: 4px; box-shadow: 0 1px 6px rgba(0,0,0,.18); }
  .hint { font-size: 13px; color: var(--muted); }
  .dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-top: 1px solid var(--line); }
  .dock .inner { max-width: 520px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
  .dock .primary { flex: 1; padding: 14px; font-size: 17px; }
  progress { width: 100%; height: 6px; margin-top: 8px; accent-color: var(--accent); }
  details summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  #log { font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); white-space: pre-wrap;
    max-height: 200px; overflow: auto; margin: 8px 0 0; }
  .notice { border-color: var(--warn); color: var(--warn); font-size: 14px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Cat Printer</h1>
    <span class="status"><span class="dot" id="dot"></span><span id="statusText">Not connected</span></span>
  </header>

  <div class="card notice" id="noBluetooth" hidden>
    This browser can't use Bluetooth. On iPhone, open this page in the free <b>Bluefy</b> app.
  </div>

  <div class="card">
    <h2>What to print</h2>
    <div class="seg" id="sourceSeg"><button data-v="text" class="on">Text</button><button data-v="image">Photo</button></div>
    <div id="textBox">
      <textarea id="text">Hello from my iPhone!</textarea>
      <div class="row"><label>Size</label><input type="range" id="size" min="12" max="80" step="1" value="28"><span class="val" id="sizeVal">28</span></div>
      <div class="toggle"><span>Bold</span><input type="checkbox" id="bold"></div>
      <div class="row"><label>Align</label>
        <div class="seg" id="alignSeg" style="flex:1"><button data-v="left" class="on">Left</button><button data-v="center">Center</button><button data-v="right">Right</button></div>
      </div>
    </div>
    <div id="imageBox" hidden>
      <div class="file"><label class="btn" for="file">Choose photo…</label><span class="name" id="fileName">No photo yet</span></div>
      <input type="file" id="file" accept="image/*" hidden>
    </div>
  </div>

  <div class="card">
    <h2>Look</h2>
    <div class="row"><label>Style</label>
      <div class="seg" id="modeSeg" style="flex:1"><button data-v="threshold" class="on">Solid</button><button data-v="dither">Dithered</button></div>
    </div>
    <div class="row"><label>Ink amount</label><input type="range" id="threshold" min="40" max="220" step="1" value="128"><span class="val" id="thresholdVal">128</span></div>
    <div class="toggle"><span>Invert</span><input type="checkbox" id="invert"></div>
  </div>

  <div class="card">
    <h2>Paper</h2>
    <div class="row"><label>Feed after</label><input type="range" id="feed" min="0" max="200" step="10" value="80"><span class="val" id="feedVal">80</span></div>
  </div>

  <div class="card preview">
    <canvas id="preview" width="384" height="40"></canvas>
    <span class="hint" id="previewInfo"></span>
  </div>

  <div class="card">
    <details open><summary>Log</summary><div id="log"></div></details>
  </div>
</main>

<div class="dock">
  <div class="inner">
    <button class="btn" id="connectBtn">Connect</button>
    <button class="btn primary" id="printBtn" disabled>Print</button>
  </div>
  <div class="inner"><progress id="progress" value="0" max="1" hidden></progress></div>
</div>

<script>
// ---------------------------------------------------------------------------------------------
// MX10 protocol. Same rules as the Mac app (CatPrinter/Sources/Printer.swift):
//  • every byte goes out in 20-byte writes (bigger writes freeze the printer)
//  • greeting A8 / BB 01 and an A3 idle check before each job, each waiting for its reply
//  • job framing copied from Fun Print: F2 01 C8 · A3 · A4 density · AF heat · A6 start ·
//    BE 00 · BD speed · rows · BD 19 · A1 feed · A6 end · A3
//  • if the printer stops taking data, drop the link, reconnect and resend (it recovers)
// ---------------------------------------------------------------------------------------------
const WIDTH = 384, BPR = 48, WRITE_SIZE = 20, HEAT = 15000;
const uuid16 = n => `0000${n.toString(16).padStart(4, '0')}-0000-1000-8000-00805f9b34fb`;
const ADV_SVC = uuid16(0xaf30), PRINT_SVC = uuid16(0xae30), TX_CHAR = uuid16(0xae01), RX_CHAR = uuid16(0xae02);
const LATTICE_START = [0xAA,0x55,0x17,0x38,0x44,0x5F,0x5F,0x5F,0x44,0x38,0x2C];
const LATTICE_END   = [0xAA,0x55,0x17,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x17];

function crc8(bytes) {
  let c = 0;
  for (const b of bytes) { c ^= b; for (let i = 0; i < 8; i++) c = (c & 0x80) ? ((c << 1) ^ 0x07) & 0xFF : (c << 1) & 0xFF; }
  return c;
}
function packet(cmd, payload = []) {
  return [0x51, 0x78, cmd, 0x00, payload.length & 0xFF, payload.length >> 8, ...payload, crc8(payload), 0xFF];
}
const le16 = v => [v & 0xFF, (v >> 8) & 0xFF];

function jobBytes(rows, { density, speed, feed }) {
  const blank = r => r.every(b => b === 0);
  let first = rows.findIndex(r => !blank(r)); if (first < 0) first = rows.length;
  let last = rows.length - 1; while (last >= 0 && blank(rows[last])) last--;
  const body = first <= last ? rows.slice(first, last + 1) : [];
  const trailing = last >= 0 ? rows.length - 1 - last : 0;
  const out = [];
  const add = p => { for (const b of p) out.push(b); };
  add(packet(0xF2, [0x01, 0xC8])); add(packet(0xA3, [0])); add(packet(0xA4, [0x30 + density]));
  add(packet(0xAF, le16(HEAT))); add(packet(0xA6, LATTICE_START)); add(packet(0xBE, [0])); add(packet(0xBD, [speed]));
  for (const r of body) add(packet(0xA2, Array.from(r)));
  add(packet(0xBD, [0x19])); add(packet(0xA1, le16(feed + trailing))); add(packet(0xA6, LATTICE_END)); add(packet(0xA3, [0]));
  return new Uint8Array(out);
}

// ---------------------------------------------------------------------------------------------
// Bluetooth
// ---------------------------------------------------------------------------------------------
const sleep = ms => new Promise(r => setTimeout(r, ms));
class Stall extends Error {}

const bt = { device: null, tx: null, rx: null, ready: false, busy: false, paused: false, awaiting: null, reconnecting: false };

function log(msg) {
  const el = document.getElementById('log');
  const t = new Date().toLocaleTimeString();
  el.textContent += `${t}  ${msg}\n`;
  el.scrollTop = el.scrollHeight;
}
const hex = b => Array.from(b, x => x.toString(16).padStart(2, '0')).join(' ');
function describe(e) {
  if (e == null) return String(e);
  if (typeof e === 'string') return e;
  const parts = [e.name, e.message, e.code !== undefined ? 'code ' + e.code : ''].filter(Boolean);
  if (parts.length) return parts.join(': ');
  try { return JSON.stringify(e) || String(e); } catch (_) { return String(e); }
}
async function step(label, fn) {
  log('… ' + label);
  try { return await fn(); }
  catch (e) { const err = new Error(`${label} failed (${describe(e)})`); err.step = label; throw err; }
}

function setStatus(text, kind) {
  document.getElementById('statusText').textContent = text;
  document.getElementById('dot').className = 'dot' + (kind ? ' ' + kind : '');
  document.getElementById('connectBtn').textContent = bt.ready || bt.busy ? 'Disconnect' : 'Connect';
  updatePrintButton();
}

let rawNotes = 0;
function onNotify(e) {
  // Read only this reply's bytes: some browsers hand over a view into a larger shared buffer.
  const v = (e && e.target && e.target.value) || (bt.rx && bt.rx.value);
  if (!v) { log('Reply event without data'); return; }
  const b = new Uint8Array(v.buffer, v.byteOffset || 0, v.byteLength);
  if (rawNotes < 6) { rawNotes++; log('raw reply: ' + hex(b)); }
  if (b[0] !== 0x51 || b[1] !== 0x78) { log('Unrecognised reply: ' + hex(b)); return; }
  if (bt.awaiting && bt.awaiting.cmd === b[2]) {
    const w = bt.awaiting; bt.awaiting = null; clearTimeout(w.timer); w.resolve(b);
    log('Printer: ' + hex(b));
    return;
  }
  if (b[2] === 0xAE) { bt.paused = b[6] === 0x10; return; }      // flow control: pause / resume
  if (b[2] === 0xD3) { log(`Print head ~${b[6]} °C`); return; }
  log('Printer: ' + hex(b));
}

async function rawWrite(piece) {
  const c = bt.tx;
  const p = typeof c.writeValueWithoutResponse === 'function' ? c.writeValueWithoutResponse(piece) : c.writeValue(piece);
  // A write that never completes means the printer has stopped taking data.
  let timer;
  await Promise.race([p, new Promise((_, rej) => { timer = setTimeout(() => rej(new Stall('write stalled')), 4000); })]);
  clearTimeout(timer);
}

async function send(bytes, onProgress) {
  for (let i = 0; i < bytes.length; i += WRITE_SIZE) {
    let waited = 0;
    while (bt.paused) { await sleep(50); if ((waited += 50) > 8000) { bt.paused = false; break; } }
    await rawWrite(bytes.slice(i, i + WRITE_SIZE));
    if (onProgress && (i / WRITE_SIZE) % 10 === 0) onProgress(i / bytes.length);
    await sleep(3);
  }
}

// Sends one command on its own and resolves with the printer's reply (or null on timeout).
function request(cmd, payload, timeout) {
  return new Promise(async (resolve, reject) => {
    const timer = setTimeout(() => { if (bt.awaiting && bt.awaiting.cmd === cmd) bt.awaiting = null; resolve(null); }, timeout);
    bt.awaiting = { cmd, resolve, timer };
    try { await send(new Uint8Array(packet(cmd, payload))); } catch (e) { clearTimeout(timer); bt.awaiting = null; reject(e); }
  });
}

async function linkUp() {
  setStatus('Connecting…', 'busy');
  const server = await step('connect to printer', () => bt.device.gatt.connect());
  let svc;
  try { svc = await step('find print service', () => server.getPrimaryService(PRINT_SVC)); }
  catch (e) {
    try { const all = await server.getPrimaryServices(); log('Services the printer offers: ' + all.map(x => x.uuid).join(', ')); }
    catch (e2) { log('Could not list services: ' + describe(e2)); }
    throw e;
  }
  bt.tx = await step('find command channel', () => svc.getCharacteristic(TX_CHAR));
  bt.rx = await step('find reply channel', () => svc.getCharacteristic(RX_CHAR));
  const pr = bt.tx.properties || {};
  log(`Command channel: writeWithoutResponse=${!!pr.writeWithoutResponse}, write=${!!pr.write}; ` +
      `browser has writeValueWithoutResponse=${typeof bt.tx.writeValueWithoutResponse === 'function'}, ` +
      `writeValue=${typeof bt.tx.writeValue === 'function'}`);
  bt.rx.removeEventListener('characteristicvaluechanged', onNotify);
  bt.rx.addEventListener('characteristicvaluechanged', onNotify);
  await step('turn on printer replies', () => bt.rx.startNotifications());
  bt.paused = false;
  rawNotes = 0;
  // Greeting, gated on replies (data sent while a reply is pending freezes the MX10).
  if (!await step('greet printer (device info)', () => request(0xA8, [0], 3000))) log('No reply to device info; continuing.');
  if (!await step('greet printer (hello)', () => request(0xBB, [1], 3000))) log('No reply to hello; continuing.');
  await sleep(1000);
  bt.ready = true;
  setStatus('Connected · ' + (bt.device.name || 'printer'), 'ok');
  log('Connected to ' + (bt.device.name || 'printer') + '.');
}

async function connect() {
  if (!navigator.bluetooth) { document.getElementById('noBluetooth').hidden = false; return; }
  try {
    log('Browser: ' + navigator.userAgent);
    bt.device = await step('choose printer', () => navigator.bluetooth.requestDevice({
      filters: [{ services: [ADV_SVC] }, { namePrefix: 'MX' }],
      optionalServices: [PRINT_SVC, ADV_SVC],
    }));
    log('Chose ' + (bt.device.name || 'a device') + '.');
    bt.device.addEventListener('gattserverdisconnected', () => {
      bt.ready = false;
      if (!bt.reconnecting) { setStatus('Not connected'); log('Disconnected.'); }
    });
    await linkUp();
  } catch (e) {
    bt.ready = false;
    setStatus('Not connected');
    if (e && e.name === 'NotFoundError') log('No printer chosen.');
    else log('Connect failed: ' + describe(e));
  }
}

function disconnect() {
  bt.reconnecting = false;
  if (bt.device && bt.device.gatt.connected) bt.device.gatt.disconnect();
}

// Polls A3 until the printer reports idle (status byte without 0x80). Three silent polls = frozen.
async function waitIdle() {
  let silent = 0;
  for (let i = 0; i < 30; i++) {
    const r = await request(0xA3, [0], 2000);
    if (r && (r[6] & 0x80) === 0) return;
    silent = r ? 0 : silent + 1;
    if (silent >= 3) throw new Stall('printer not answering');
    await sleep(1000);
  }
  log("Printer didn't report idle; sending anyway.");
}

async function printJob(bytes) {
  const bar = document.getElementById('progress');
  bt.busy = true; bar.hidden = false; bar.value = 0;
  setStatus('Printing…', 'busy');
  const started = performance.now();
  try {
    for (let attempt = 0; attempt <= 2; attempt++) {
      try {
        await waitIdle();
        await sleep(500);
        await send(bytes, f => bar.value = f);
        bar.value = 1;
        log(`Sent to printer in ${((performance.now() - started) / 1000).toFixed(1)} s.`);
        return;
      } catch (e) {
        if (!(e instanceof Stall) || attempt === 2) throw e;
        log(`Printer hiccuped (${e.message}) — reconnecting and resending (${attempt + 1}/2)…`);
        bt.reconnecting = true; bt.ready = false;
        try { bt.device.gatt.disconnect(); } catch (_) {}
        await sleep(1500);
        await linkUp();
        bt.reconnecting = false;
      }
    }
  } catch (e) {
    log('Print failed: ' + describe(e) + '. Try again.');
  } finally {
    bt.busy = false; bt.reconnecting = false; bar.hidden = true;
    setStatus(bt.device && bt.device.gatt.connected && bt.ready ? 'Connected · ' + (bt.device.name || 'printer') : 'Not connected',
              bt.ready ? 'ok' : '');
  }
}

// ---------------------------------------------------------------------------------------------
// Rendering: text or photo → 1-bit rows, 48 bytes each, least significant bit = leftmost dot
// ---------------------------------------------------------------------------------------------
const ui = {
  source: 'text', align: 'left', mode: 'threshold', image: null,
  get: id => document.getElementById(id),
};

function wrapLines(ctx, text, maxW) {
  const out = [];
  for (const para of text.split('\n')) {
    let line = '';
    for (const word of para.split(/(\s+)/)) {
      const test = line + word;
      if (ctx.measureText(test).width <= maxW || !line) {
        if (ctx.measureText(test).width > maxW) {            // a single word wider than the line
          let chunk = '';
          for (const ch of test) { if (ctx.measureText(chunk + ch).width > maxW && chunk) { out.push(chunk); chunk = ch; } else chunk += ch; }
          line = chunk;
        } else line = test;
      } else { out.push(line.trimEnd()); line = word.trimStart(); }
    }
    out.push(line);
  }
  return out;
}

function renderText() {
  const size = +ui.get('size').value, bold = ui.get('bold').checked;
  const c = document.createElement('canvas'), ctx = c.getContext('2d');
  const font = `${bold ? '700' : '400'} ${size}px -apple-system, "SF Pro Text", system-ui, sans-serif`;
  ctx.font = font;
  const lines = wrapLines(ctx, ui.get('text').value || ' ', WIDTH - 12);
  const lineH = Math.round(size * 1.25);
  c.width = WIDTH; c.height = Math.max(1, lines.length * lineH + 8);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.fillStyle = '#000'; ctx.font = font; ctx.textBaseline = 'top';
  ctx.textAlign = ui.align;
  const x = ui.align === 'left' ? 6 : ui.align === 'center' ? WIDTH / 2 : WIDTH - 6;
  lines.forEach((l, i) => ctx.fillText(l, x, 4 + i * lineH));
  return c;
}

function renderImage() {
  if (!ui.image) return null;
  const img = ui.image, h = Math.max(1, Math.round(img.height * WIDTH / img.width));
  const c = document.createElement('canvas'); c.width = WIDTH; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, WIDTH, h);
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, WIDTH, h);
  return c;
}

function toRows(canvas) {
  const h = canvas.height, data = canvas.getContext('2d').getImageData(0, 0, WIDTH, h).data;
  const invert = ui.get('invert').checked, cut = +ui.get('threshold').value, dither = ui.mode === 'dither';
  const g = new Float32Array(WIDTH * h);
  for (let i = 0; i < WIDTH * h; i++) {
    const v = 0.299 * data[i * 4] + 0.587 * data[i * 4 + 1] + 0.114 * data[i * 4 + 2];
    g[i] = invert ? 255 - v : v;
  }
  const rows = [];
  for (let y = 0; y < h; y++) {
    const row = new Uint8Array(BPR);
    for (let x = 0; x < WIDTH; x++) {
      const i = y * WIDTH + x, old = g[i], black = old < cut;
      if (black) row[x >> 3] |= 1 << (x & 7);
      if (dither) {                                            // Floyd–Steinberg
        const err = old - (black ? 0 : 255);
        if (x + 1 < WIDTH) g[i + 1] += err * 7 / 16;
        if (y + 1 < h) {
          if (x > 0) g[i + WIDTH - 1] += err * 3 / 16;
          g[i + WIDTH] += err * 5 / 16;
          if (x + 1 < WIDTH) g[i + WIDTH + 1] += err / 16;
        }
      }
    }
    rows.push(row);
  }
  return rows;
}

let currentRows = [];
function refresh() {
  const src = ui.source === 'text' ? renderText() : renderImage();
  currentRows = src ? toRows(src) : [];
  const pv = ui.get('preview'), info = ui.get('previewInfo');
  if (!currentRows.length) {
    pv.width = WIDTH; pv.height = 40;
    const ctx = pv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, WIDTH, 40);
    info.textContent = 'Choose a photo to see it here';
  } else {
    pv.width = WIDTH; pv.height = currentRows.length;
    const ctx = pv.getContext('2d'), img = ctx.createImageData(WIDTH, currentRows.length);
    currentRows.forEach((row, y) => {
      for (let x = 0; x < WIDTH; x++) {
        const v = (row[x >> 3] >> (x & 7)) & 1 ? 0 : 255, p = (y * WIDTH + x) * 4;
        img.data[p] = img.data[p + 1] = img.data[p + 2] = v; img.data[p + 3] = 255;
      }
    });
    ctx.putImageData(img, 0, 0);
    info.textContent = `${currentRows.length} lines · ${Math.round(currentRows.length / 8)} mm of paper`;
  }
  updatePrintButton();
}

function updatePrintButton() {
  ui.get('printBtn').disabled = !bt.ready || bt.busy || !currentRows.length;
}

// ---------------------------------------------------------------------------------------------
// Controls (settings remembered on this device)
// ---------------------------------------------------------------------------------------------
const store = {
  get(k, d) { try { const v = localStorage.getItem('catprinter.' + k); return v === null ? d : v; } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem('catprinter.' + k, v); } catch (_) {} },
};

function segmented(id, onChange) {
  const seg = ui.get(id);
  seg.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    onChange(b.dataset.v);
  });
}
function setSeg(id, v) { ui.get(id).querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.v === v)); }

let refreshTimer;
const scheduleRefresh = () => { clearTimeout(refreshTimer); refreshTimer = setTimeout(refresh, 60); };

segmented('sourceSeg', v => {
  ui.source = v;
  ui.get('textBox').hidden = v !== 'text'; ui.get('imageBox').hidden = v !== 'image';
  ui.mode = v === 'image' ? 'dither' : 'threshold'; setSeg('modeSeg', ui.mode);
  refresh();
});
segmented('alignSeg', v => { ui.align = v; refresh(); });
segmented('modeSeg', v => { ui.mode = v; refresh(); });

for (const id of ['size', 'threshold', 'feed']) {
  const el = ui.get(id), val = ui.get(id + 'Val');
  if (id === 'feed') el.value = store.get(id, el.value);
  val.textContent = el.value;
  el.addEventListener('input', () => {
    val.textContent = el.value;
    if (id === 'feed') store.set(id, el.value); else scheduleRefresh();
  });
}
ui.get('text').addEventListener('input', scheduleRefresh);
ui.get('bold').addEventListener('change', refresh);
ui.get('invert').addEventListener('change', refresh);

ui.get('file').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    ui.image = await createImageBitmap(f, { imageOrientation: 'from-image' }).catch(() => createImageBitmap(f));
    ui.get('fileName').textContent = f.name;
  } catch (err) { log('Could not open that image: ' + err.message); }
  refresh();
});

ui.get('connectBtn').addEventListener('click', () => (bt.ready || bt.busy) ? disconnect() : connect());
ui.get('printBtn').addEventListener('click', () => {
  if (!currentRows.length || !bt.ready || bt.busy) return;
  // Fixed, like the Mac app: Fun Print's defaults (density 4, speed 10). Darker settings froze the printer on dense images.
  const density = 4, speed = 10, feed = +ui.get('feed').value;
  log(`Printing ${currentRows.length} lines…`);
  printJob(jobBytes(currentRows, { density, speed, feed }));
});

if (!navigator.bluetooth) ui.get('noBluetooth').hidden = false;
refresh();
</script>
</body>
</html>
